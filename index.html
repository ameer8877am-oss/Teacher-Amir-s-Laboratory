  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: #111827;
      --bg-card-2: #172033;
      --border: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --blue: #3b82f6;
      --blue-deep: #1d4ed8;
      --violet: #7c3aed;
      --teal: #14b8a6;
      --amber: #f59e0b;
      --rose: #ef4444;
      --emerald: #10b981;
      --r-xl: 22px;
      --r-lg: 16px;
      --r-md: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: radial-gradient(circle at top, #101b33 0%, var(--bg-dark) 55%);
      color: var(--text);
      line-height: 1.75;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(11, 17, 30, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .topbar-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0.65rem 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.6rem;
      flex-wrap: wrap;
    }

    .icon-nav {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }

    .icon-btn {
      height: 40px;
      padding: 0 0.78rem;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: 0.16s ease;
    }

    .icon-btn.is-active {
      background: var(--violet);
      border-color: var(--violet);
      color: #ffffff;
    }

    .util-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .util-btn {
      width: 38px;
      height: 38px;
      border-radius: var(--r-md);
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 1.2rem 0.95rem 2.5rem;
    }

    .hero-banner {
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.35), rgba(13, 148, 136, 0.25));
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 1.4rem 1.2rem;
      margin-bottom: 1.3rem;
    }

    .hero-banner h1 {
      font-size: 1.45rem;
      font-weight: 900;
      margin-bottom: 0.35rem;
    }

    .hero-banner p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    .view-section {
      display: none;
    }

    .view-section.is-open {
      display: block;
    }

    .stage-group {
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 1rem;
      margin-bottom: 1.15rem;
    }

    .stage-label {
      font-size: 0.95rem;
      font-weight: 800;
      color: #cbd5e1;
      margin-bottom: 0.85rem;
      padding-bottom: 0.45rem;
      border-bottom: 1px solid var(--border);
    }

    .three-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.75rem;
    }

    @media (max-width: 640px) {
      .three-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 0.5rem;
      }
    }

    .grade-card {
      position: relative;
      background: var(--bg-card-2);
      border: 1.5px solid var(--border);
      border-radius: var(--r-lg);
      padding: 0.95rem 0.55rem 0.8rem;
      text-align: center;
      cursor: pointer;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .grade-card:hover {
      transform: translateY(-2px);
      border-color: var(--blue);
    }

    .grade-num {
      position: absolute;
      top: 0.4rem;
      right: 0.55rem;
      font-size: 1.15rem;
      font-weight: 900;
      opacity: 0.25;
    }

    .grade-emoji {
      font-size: 1.55rem;
      line-height: 1.1;
    }

    .grade-name {
      font-size: 0.88rem;
      font-weight: 800;
    }

    .grade-chapters-badge {
      font-size: 0.72rem;
      color: #cbd5e1;
      background: rgba(15, 23, 42, 0.65);
      padding: 0.12rem 0.45rem;
      border-radius: 999px;
    }

    .pill-cta {
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 0.35rem 0.5rem;
      font-size: 0.74rem;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
    }

    .c-teal { background: #0d9488; }
    .c-amber { background: #d97706; }
    .c-blue { background: #2563eb; }
    .c-violet { background: #7c3aed; }
    .c-emerald { background: #059669; }
    .c-rose { background: #e11d48; }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal-sheet {
      width: 100%;
      max-width: 540px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      overflow: hidden;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
    }

    .modal-head {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      padding: 1.1rem 1.2rem;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .modal-head h3 {
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffffff;
    }

    .modal-head p {
      font-size: 0.84rem;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 0.2rem;
    }

    .close-x {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.35);
      background: rgba(15, 23, 42, 0.35);
      color: #ffffff;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    .modal-body {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    .hub-tile {
      background: var(--bg-card-2);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 0.95rem;
      text-align: right;
      cursor: pointer;
      color: var(--text);
      transition: border-color 0.15s ease;
    }

    .hub-tile.full-span {
      grid-column: 1 / -1;
    }

    .hub-tile:hover {
      border-color: var(--blue);
    }

    .hub-tile strong {
      display: block;
      font-size: 0.98rem;
      margin-top: 0.25rem;
    }

    .hub-tile span {
      display: block;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }

    .filter-strip {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .filter-pill {
      padding: 0.42rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
    }

    .filter-pill.is-active {
      background: var(--text);
      color: var(--bg-dark);
      border-color: var(--text);
    }

    .mindmap-wrap {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--r-xl);
      padding: 1.4rem 1rem;
      margin-bottom: 1.2rem;
      text-align: center;
    }
