<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مكتبتي التعليمية | مختبر الفيزياء التفاعلي</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
  <style>
    :root {
      --bg: #f4f7fb;
      --surface: #ffffff;
      --ink: #132238;
      --muted: #52647a;
      --primary: #0f766e;
      --primary-soft: #ccfbf1;
      --accent: #b45309;
      --line: #dce5f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.75;
    }
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-inner {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0.75rem 1rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .brand {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary);
      text-decoration: none;
    }
    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }
    nav button {
      background: transparent;
      border: 1px solid transparent;
      color: var(--ink);
      padding: 0.35rem 0.7rem;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    nav button:hover {
      background: var(--bg);
      border-color: var(--line);
    }
    nav button.active {
      background: var(--primary);
      color: #fff;
    }
    .hero {
      max-width: 1040px;
      margin: 1.5rem auto 0;
      padding: 0 1rem;
    }
    .hero-box {
      background: linear-gradient(135deg, #0f766e 0%, #164e63 100%);
      color: #fff;
      border-radius: 16px;
      padding: 2rem 1.5rem;
    }
    .hero-box h1 { font-size: 1.7rem; margin-bottom: 0.5rem; }
    .hero-box p { opacity: 0.92; max-width: 720px; font-size: 0.98rem; }
    main {
      max-width: 1040px;
      margin: 1.5rem auto 2.5rem;
      padding: 0 1rem;
    }
    .panel { display: none; }
    .panel.active { display: block; }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-head h2 {
      font-size: 1.3rem;
      color: var(--ink);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(265px, 1fr));
      gap: 1rem;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.15rem;
      box-shadow: 0 2px 8px rgba(19, 34, 56, 0.04);
    }
    .tag {
      display: inline-block;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 0.78rem;
      font-weight: 700;
      padding: 0.15rem 0.55rem;
      border-radius: 6px;
      margin-bottom: 0.5rem;
    }
    .card h3 { font-size: 1.05rem; margin-bottom: 0.4rem; }
    .card p { color: var(--muted); font-size: 0.92rem; margin-bottom: 0.6rem; }
    .formula-box {
      background: var(--bg);
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 0.6rem;
      text-align: center;
      direction: ltr;
      overflow-x: auto;
      margin-top: 0.5rem;
    }
    .sim-box {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1.25rem;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1rem;
      margin: 1rem 0;
    }
    .control-item label {
      display: block;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .control-item input[type="range"] {
      width: 100%;
      accent-color: var(--primary);
    }
    .result-strip {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      font-weight: 700;
    }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.88rem;
      padding: 1.5rem 1rem 2.5rem;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#home" onclick="showTab('home')">مكتبتي التعليمية</a>
      <nav id="tabs">
        <button class="active" data-tab="home" onclick="showTab('home')">الرئيسية</button>
        <button data-tab="curriculum" onclick="showTab('curriculum')">تجارب المنهج</button>
        <button data-tab="examples" onclick="showTab('examples')">الأمثلة المحلولة</button>
        <button data-tab="maps" onclick="showTab('maps')">خرائط الفصول</button>
        <button data-tab="free-lab" onclick="showTab('free-lab')">المختبر الحر</button>
        <button data-tab="formulas" onclick="showTab('formulas')">القوانين</button>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="hero-box">
      <h1>مكتبتي التعليمية — مختبر الفيزياء التفاعلي</h1>
      <p>منصة تعليمية لتنظيم التجارب الفيزيائية، الأمثلة المحلولة، خرائط الفصول، المحاكاة الحرة، والقوانين الأساسية.</p>
    </div>
  </section>

  <main>
    <section id="home" class="panel active">
      <div class="section-head"><h2>نظرة عامة على الأقسام</h2></div>
      <div class="grid">
        <div class="card">
          <span class="tag">عملي</span>
          <h3>تجارب المنهج</h3>
          <p>تجارب عملية منظمة مع الأدوات والخطوات والعلاقات الرياضية.</p>
        </div>
